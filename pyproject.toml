[project]
name = "langchain-abstract"
version = "0.1.0"
description = "LangChain chat model for Abstract (abstract.inc)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abstract" }]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.6.12,<2",
    "langchain-openai>=1.7.2,<2",
]

[project.urls]
Homepage = "https://abstract.inc"
Documentation = "https://abstract.inc/docs"
Repository = "https://github.com/abstractpbc/langchain-abstract"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain-tests>=1.1.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
